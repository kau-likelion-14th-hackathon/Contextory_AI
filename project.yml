# 프로젝트 메타 레지스트리
#
# 분석 요청(Spring Boot → AI)에는 프로젝트 정보가 담기지 않는다.
# Grounded Prompt의 [프로젝트 정보] 섹션은 여기서 저장소 이름으로 찾아 채운다.
# (백엔드가 나중에 요청에 project 객체를 담게 되면 그쪽이 우선한다 — 이 파일은 폴백)
#
# - 키는 `owner/repo` 또는 `repo` 둘 다 매칭된다 (대소문자 무시)
# - roles 는 계약상 허용 7종만 유효하다:
#   프론트엔드 / 백엔드 / AI / 기획 / 디자인 / QA / 프로젝트 관리자
#   (목록 밖 값은 로드 시 제거된다 — 임의 역할이 프롬프트에 들어가는 것을 막기 위함)
# - 항목이 없으면 default 가 쓰이고, default 도 없으면 프롬프트에 "(정보 없음)"으로 표기되어
#   affectedRoles / roleImpacts 를 만들지 않는다.

default:
  language: ko
  roles:
    - 프론트엔드
    - 백엔드
    - AI
    - 기획
    - 디자인
    - QA
    - 프로젝트 관리자

projects:
  "kau-likelion-14th-hackathon/Contextory_AI":
    name: Contextory
    description: GitHub PR을 AI가 분석해 프로젝트 기록 초안을 만들고, 사람이 검토·승인해 프로젝트 메모리에 축적하는 서비스
    purpose: 팀원이 "이 변경이 왜 이렇게 됐는지"를 나중에 검색해 이해할 수 있게 한다
    features:
      - PR 분석 및 프로젝트 기록 초안 생성
      - 기록 검토·승인 후 프로젝트 메모리 축적
      - pgvector 기반 프로젝트 컨텍스트 검색(RAG)
    roles:
      - 프론트엔드
      - 백엔드
      - AI
      - 기획

  "kau-likelion-14th-hackathon/Contextory_BackEnd":
    name: Contextory
    description: Contextory 백엔드 (GitHub 연동, 분석 요청·콜백 수신, 기록 저장)
    purpose: 팀원이 "이 변경이 왜 이렇게 됐는지"를 나중에 검색해 이해할 수 있게 한다
    features:
      - GitHub PR 웹훅 수신 및 AI 분석 요청
      - 분석 결과 콜백 저장 및 기록 승인 플로우
    roles:
      - 프론트엔드
      - 백엔드
      - AI
      - 기획
