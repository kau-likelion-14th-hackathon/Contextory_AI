services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # postgres:18+ 공식 이미지는 데이터 디렉토리 레이아웃이 바뀌어 마운트 지점이
      # /var/lib/postgresql/data가 아니라 /var/lib/postgresql (상위)이어야 한다.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # 기본은 5432. 로컬에 기존 Postgres가 이미 5432를 쓰고 있어 충돌하는 환경에서는
      # .env에 POSTGRES_HOST_PORT=5433 처럼 개인 설정으로 오버라이드한다(팀 공용 기본값은 건드리지 않음).
      # 127.0.0.1로 바인딩해 로컬(DataGrip 등)에서만 접속 가능하게 하고 외부 네트워크엔 노출하지 않는다 —
      # app/celery_worker 컨테이너는 이 publish와 무관하게 Docker 내부망(postgres:5432)으로 접속한다.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    restart: unless-stopped
    command: celery -A workers.celery_app.celery_app worker --loglevel=info
    env_file: .env
    # 이미지에 내장된 Dockerfile HEALTHCHECK는 uvicorn의 /health를 HTTP로 확인하는데,
    # celery_worker는 웹서버가 없는 컨테이너라 그 체크가 항상 실패한다. worker 프로세스가
    # 실제로 응답하는지 확인하는 celery ping으로 오버라이드한다.
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
